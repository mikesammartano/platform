<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0}button{font-family:inherit}</style></helmet>
<div style="position:relative;width:1920px;height:1080px;overflow:hidden;background:#050505;font-family:Geist,Inter,system-ui,sans-serif;color:#F7F7F5">
<img src="scene5.png" alt="Oceanic-continental subduction cross-section" style="position:absolute;left:0;top:0;width:1920px;height:1080px;display:block">
<sc-if value="{{ isSpot }}"><div style="position:absolute;inset:0;background:radial-gradient(circle 250px at 830px 790px,rgba(0,0,0,0) 0,rgba(0,0,0,0) 190px,rgba(0,0,0,.66) 330px,rgba(0,0,0,.66) 100%)"></div></sc-if>
<sc-if value="{{ isDraw }}"><svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0" fill="none" stroke="#F2C94C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="850" cy="790" rx="215" ry="95" transform="rotate(40 850 790)"/><path d="M560 640C600 650 650 690 690 735M690 735l-6-34M690 735l-34-8"/></svg></sc-if>

<sc-if value="{{ showNote }}"><div style="position:absolute;left:36px;bottom:32px;width:270px;font-size:14px;line-height:1.45;font-weight:500;color:rgba(247,247,245,.74);text-shadow:0 1px 10px rgba(0,0,0,.9)">Simplified model. Motion is accelerated. Scale and geometry are not exact.</div></sc-if>
<sc-if value="{{ isPresent }}"><div style="position:absolute;left:32px;bottom:32px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:rgba(247,247,245,.7)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></div></sc-if>

<sc-if value="{{ showLegend }}"><div style="position:absolute;left:36px;bottom:124px;width:264px;box-sizing:border-box;padding:18px 20px 16px;border-radius:16px;background:rgba(28,28,30,.84);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);display:flex;flex-direction:column;gap:14px"><div style="font-size:17px;font-weight:600">Earthquake depth</div><div style="height:10px;border-radius:5px;background:linear-gradient(90deg,#F2C94C,#E8833A,#C93A3A,#6A1B3A)"></div><div style="display:flex;justify-content:space-between;font-size:15px;color:#B4B4AF"><span>Shallow</span><span>Deep</span></div></div></sc-if>

<sc-if value="{{ isClosed }}"><button aria-label="Open Teacher Tools" style="position:absolute;right:16px;top:16px;height:68px;padding:0 24px 0 20px;gap:12px;font-size:19px;font-weight:600;border:0;border-radius:20px;background:rgba(28,28,30,.82);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);color:#F7F7F5;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(44,44,47,.92)" style-focus="outline:3px solid #07834D;outline-offset:3px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15M18.5 9.5L16 12l2.5 2.5"/></svg>Tools</button></sc-if>
<sc-if value="{{ isPresent }}"><button style="position:absolute;right:32px;top:32px;height:60px;padding:0 26px 0 22px;border:0;border-radius:30px;background:rgba(28,28,30,.7);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);color:#F7F7F5;font-size:18px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:12px" style-hover="background:rgba(44,44,47,.92)" style-focus="outline:3px solid #07834D;outline-offset:3px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>Exit</button></sc-if>

<sc-if value="{{ notPresent }}"><div style="position:absolute;left:{{ playLeft }}px;bottom:32px;width:440px;height:64px;box-sizing:border-box;padding:0 8px;border-radius:18px;background:rgba(28,28,30,.76);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);display:flex;align-items:center;gap:8px">
<button aria-label="Pause" style="width:60px;height:60px;border:0;background:transparent;color:#F7F7F5;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:14px;flex:none" style-hover="background:rgba(255,255,255,.08)" style-focus="outline:3px solid #07834D;outline-offset:-3px"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4" width="4.5" height="16" rx="1.2"/><rect x="14" y="4" width="4.5" height="16" rx="1.2"/></svg></button>
<div style="flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.2)"><div style="width:58%;height:5px;border-radius:3px;background:#07834D"></div></div>
<button style="width:64px;height:60px;border:0;background:transparent;color:#B4B4AF;font-size:17px;font-weight:600;cursor:pointer;border-radius:14px;flex:none" style-hover="color:#F7F7F5">1×</button></div></sc-if>
<sc-if value="{{ isPresent }}"><div style="position:absolute;left:740px;bottom:38px;width:440px;display:flex;align-items:center;gap:16px;opacity:.72"><svg width="24" height="24" viewBox="0 0 24 24" fill="#F7F7F5" style="filter:drop-shadow(0 1px 6px rgba(0,0,0,.8))"><rect x="5.5" y="4" width="4.5" height="16" rx="1.2"/><rect x="14" y="4" width="4.5" height="16" rx="1.2"/></svg><div style="flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.28)"><div style="width:58%;height:4px;border-radius:2px;background:#07834D"></div></div></div></sc-if>

<sc-if value="{{ panelOpen }}"><div style="position:absolute;right:16px;top:16px;bottom:16px;width:416px;box-sizing:border-box;padding:16px 20px 12px;border-radius:20px;background:rgba(28,28,30,.88);backdrop-filter:blur(48px);-webkit-backdrop-filter:blur(48px);display:flex;flex-direction:column">

<sc-if value="{{ notTeach }}"><div style="display:grid;grid-template-columns:repeat(4,1fr)">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4"><button aria-pressed="{{ t.on }}" style="height:96px;border:0;border-radius:18px;background:{{ t.bg }};color:{{ t.fg }};font-size:18px;font-weight:{{ t.w }};cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0" style-hover="background:rgba(255,255,255,.05)" style-focus="outline:3px solid #07834D;outline-offset:-3px"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="{{ t.ic }}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.d }}"/></svg>{{ t.label }}</button></sc-for></div></sc-if>

<sc-if value="{{ isShow }}"><div style="flex:1;margin-top:14px;display:flex;flex-direction:column;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{ sections }}" as="s" hint-placeholder-count="3"><div style="display:flex;flex-direction:column">
<div style="font-size:16px;font-weight:600;color:#9A9A95;height:38px;display:flex;align-items:flex-end;padding:0 14px 6px">{{ s.title }}</div>
<sc-for list="{{ s.rows }}" as="r" hint-placeholder-count="4"><button aria-pressed="{{ r.on }}" style="height:58px;border:0;border-radius:14px;background:transparent;padding:0 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;color:{{ r.fg }};font-size:21px;font-weight:{{ r.w }};text-align:left" style-hover="background:rgba(255,255,255,.06)" style-active="background:rgba(255,255,255,.1)" style-focus="outline:3px solid #07834D;outline-offset:-3px">{{ r.name }}<span style="width:32px;height:32px;border-radius:50%;box-sizing:border-box;flex:none;background:{{ r.dot }};border:2px solid {{ r.ring }};display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7F7F5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:{{ r.chk }}"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></button></sc-for></div></sc-for></div>
<button style="height:56px;border:0;border-radius:14px;background:transparent;color:#A8A8A3;font-size:21px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 14px;text-align:left" style-hover="background:rgba(255,255,255,.06);color:#F7F7F5">Geology<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div></sc-if>

<sc-if value="{{ isEvidence }}"><div style="flex:1;margin-top:18px;display:flex;flex-direction:column;gap:4px">
<sc-for list="{{ datasets }}" as="d" hint-placeholder-count="6"><button aria-pressed="{{ d.on }}" style="height:70px;border:0;border-radius:14px;background:transparent;padding:0 14px;display:flex;align-items:center;justify-content:space-between;color:{{ d.fg }};font-size:22px;font-weight:{{ d.w }};cursor:pointer;text-align:left" style-hover="background:rgba(255,255,255,.06)" style-active="background:rgba(255,255,255,.1)">{{ d.name }}<span style="width:32px;height:32px;border-radius:50%;box-sizing:border-box;flex:none;background:{{ d.dot }};border:2px solid {{ d.ring }};display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7F7F5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:{{ d.chk }}"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></button></sc-for></div></sc-if>

<sc-if value="{{ isDrawTab }}"><div style="flex:1;margin-top:8px;display:flex;flex-direction:column;justify-content:space-between;padding-bottom:20px">
<div><div style="font-size:16px;font-weight:600;color:#9A9A95;height:36px;display:flex;align-items:flex-end;padding:0 4px 8px">Tools</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px"><sc-for list="{{ annoTools }}" as="a" hint-placeholder-count="8"><button aria-pressed="{{ a.on }}" style="height:92px;border:0;border-radius:16px;background:{{ a.bg }};color:{{ a.fg }};font-size:15px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0" style-hover="background:rgba(255,255,255,.07)" style-focus="outline:3px solid #07834D;outline-offset:-3px"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="{{ a.ic }}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{ a.d }}"/></svg>{{ a.label }}</button></sc-for></div></div>
<div><div style="font-size:16px;font-weight:600;color:#9A9A95;height:36px;display:flex;align-items:flex-end;padding:0 4px 8px">History</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px"><sc-for list="{{ history }}" as="a" hint-placeholder-count="2"><button aria-disabled="{{ a.off }}" style="height:72px;border:0;border-radius:16px;background:rgba(255,255,255,.05);color:#F7F7F5;opacity:{{ a.op }};font-size:18px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;padding:0" style-hover="background:rgba(255,255,255,.09)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{ a.d }}"/></svg>{{ a.label }}</button></sc-for></div></div>
<div style="opacity:{{ dim }}"><div style="font-size:16px;font-weight:600;color:#9A9A95;height:36px;display:flex;align-items:flex-end;padding:0 4px 8px">Color</div>
<div style="display:flex;justify-content:space-between"><sc-for list="{{ colors }}" as="c" hint-placeholder-count="5"><button aria-label="{{ c.name }}" aria-pressed="{{ c.on }}" style="width:72px;height:72px;border:0;border-radius:50%;padding:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center"><span style="width:58px;height:58px;box-sizing:border-box;border-radius:50%;border:2px solid {{ c.ring }};display:flex;align-items:center;justify-content:center"><span style="width:44px;height:44px;border-radius:50%;background:{{ c.hex }}"></span></span></button></sc-for></div></div>
<div style="opacity:{{ dim }}"><div style="font-size:16px;font-weight:600;color:#9A9A95;height:36px;display:flex;align-items:flex-end;padding:0 4px 8px">Width</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px"><sc-for list="{{ widths }}" as="w" hint-placeholder-count="3"><button aria-pressed="{{ w.on }}" style="height:84px;border:0;border-radius:16px;background:{{ w.bg }};color:{{ w.fg }};font-size:15px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0"><svg width="64" height="14" viewBox="0 0 64 14"><line x1="8" y1="7" x2="56" y2="7" stroke="{{ w.fg }}" stroke-width="{{ w.px }}" stroke-linecap="round"/></svg>{{ w.label }}</button></sc-for></div></div>
</div></sc-if>

<sc-if value="{{ isView }}"><div style="flex:1;margin-top:18px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;flex-direction:column;gap:12px">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.06)"><sc-for list="{{ views }}" as="v" hint-placeholder-count="3"><button aria-pressed="{{ v.on }}" style="height:56px;border:0;border-radius:12px;background:{{ v.bg }};color:{{ v.fg }};font-size:17px;font-weight:{{ v.w }};cursor:pointer;padding:0" style-hover="background:rgba(255,255,255,.1)">{{ v.name }}</button></sc-for></div>
<div style="width:100%;height:210px;border-radius:14px;background-image:url(scene5.png);background-repeat:no-repeat;background-size:376px auto;background-position:0 0"></div></div>
<div style="display:flex;flex-direction:column"><div style="font-size:16px;font-weight:600;color:#9A9A95;height:36px;display:flex;align-items:flex-end;padding:0 14px 6px">Focus</div>
<sc-for list="{{ focus }}" as="f" hint-placeholder-count="5"><button style="height:62px;border:0;border-radius:14px;background:transparent;color:#F7F7F5;font-size:20px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:16px;padding:0 10px;text-align:left" style-hover="background:rgba(255,255,255,.06)" style-active="background:rgba(255,255,255,.1)"><span style="width:44px;height:44px;border-radius:10px;flex:none;background-image:url(scene5.png);background-repeat:no-repeat;background-size:528px auto;background-position:{{ f.pos }}"></span>{{ f.name }}</button></sc-for></div></div></sc-if>

<sc-if value="{{ notTeach }}"><div style="display:flex;flex-direction:column;gap:20px;height:172px;justify-content:flex-end">
<button style="height:88px;flex:none;border:0;border-radius:20px;background:rgba(255,255,255,.08);color:#F7F7F5;cursor:pointer;display:flex;align-items:center;gap:18px;padding:0 20px;text-align:left" style-hover="background:rgba(255,255,255,.13)" style-focus="outline:3px solid #07834D;outline-offset:3px"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F7F7F5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M10 8.4v7.2l5.8-3.6z"/></svg><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font-size:22px;font-weight:700">Teach</span><span style="font-size:16px;color:#B4B4AF;font-weight:500">Guided sequence</span></span><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#B4B4AF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
<div style="display:flex;justify-content:space-between;align-items:center;height:64px"><button style="height:64px;padding:0 20px 0 16px;border:0;border-radius:14px;background:transparent;color:#B4B4AF;font-size:18px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:12px" style-hover="color:#F7F7F5;background:rgba(255,255,255,.05)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5v5h5M5.2 14.5A8 8 0 1 0 6 7.2L4 10"/></svg>Reset</button><button aria-label="Collapse Teacher Tools" style="height:64px;padding:0 16px 0 20px;border:0;border-radius:14px;background:transparent;color:#B4B4AF;font-size:18px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:12px" style-hover="color:#F7F7F5;background:rgba(255,255,255,.05)" style-focus="outline:3px solid #07834D;outline-offset:-3px">Collapse<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15M16.3 9.5l2.5 2.5-2.5 2.5"/></svg></button></div></div></sc-if>

<sc-if value="{{ isTeach }}"><div style="flex:1;display:flex;flex-direction:column;padding:8px 8px 0">
<div style="font-size:20px;font-weight:600;color:#B4B4AF">3 of 7</div>
<div style="display:flex;gap:6px;margin-top:12px"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="7"><div style="flex:1;height:4px;border-radius:2px;background:{{ d }}"></div></sc-for></div>
<div style="margin-top:48px;font-size:48px;line-height:1.05;font-weight:700;letter-spacing:-.025em">Earthquakes</div>
<div style="margin-top:22px;font-size:22px;line-height:1.4;color:#D4D4CF;text-wrap:pretty">Notice how earthquake depth changes beneath the continent.</div>
<div style="margin-top:56px;font-size:17px;font-weight:600;color:#9A9A95">Ask students</div>
<div style="margin-top:12px;font-size:33px;line-height:1.18;font-weight:600;letter-spacing:-.015em;text-wrap:pretty">What pattern do you notice?</div>
<div style="flex:1"></div>
<div style="display:flex;flex-direction:column;gap:20px;height:172px;justify-content:flex-end;margin:0 -8px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;height:88px"><button style="border:0;border-radius:20px;background:rgba(255,255,255,.08);color:#F7F7F5;font-size:21px;font-weight:600;cursor:pointer" style-hover="background:rgba(255,255,255,.13)">Previous</button><button style="border:0;border-radius:20px;background:#F7F7F5;color:#050505;font-size:21px;font-weight:700;cursor:pointer" style-hover="background:#fff" style-focus="outline:3px solid #07834D;outline-offset:3px">Next</button></div>
<div style="display:flex;justify-content:space-between;align-items:center;height:64px"><button style="height:64px;padding:0 20px 0 16px;border:0;border-radius:14px;background:transparent;color:#B4B4AF;font-size:18px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:12px" style-hover="color:#F7F7F5;background:rgba(255,255,255,.05)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></svg>Exit teaching</button><button aria-label="Collapse Teacher Tools" style="height:64px;padding:0 16px 0 20px;border:0;border-radius:14px;background:transparent;color:#B4B4AF;font-size:18px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:12px" style-hover="color:#F7F7F5;background:rgba(255,255,255,.05)" style-focus="outline:3px solid #07834D;outline-offset:-3px">Collapse<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15M16.3 9.5l2.5 2.5-2.5 2.5"/></svg></button></div></div></div></sc-if></div></sc-if>
</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;closed&quot;,&quot;show&quot;,&quot;evidence&quot;,&quot;draw&quot;,&quot;spotlight&quot;,&quot;view&quot;,&quot;teach&quot;,&quot;present&quot;],&quot;default&quot;:&quot;show&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state || 'closed';
    const open = ['show','evidence','draw','spotlight','view','teach'].includes(s);
    const tabId = s==='spotlight'?'draw':s;
    const T = [['show','Show','M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 9.25a2.75 2.75 0 100 5.5 2.75 2.75 0 000-5.5z'],['evidence','Evidence','M3 12h4l3-7 4 14 3-7h4'],['draw','Draw','M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19zM14 7l3 3'],['view','View','M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4']];
    const tabs = T.map(([id,label,d]) => { const on = id===tabId; return {label,d,on,bg:on?'rgba(255,255,255,.09)':'transparent',fg:on?'#F7F7F5':'#8E8E89',w:on?600:500,ic:on?'#1FB574':'#8E8E89'}; });
    const row = (name,on)=>({name,on,fg:on?'#F7F7F5':'#A8A8A3',w:on?600:500,chk:on?1:0,dot:on?'#07834D':'transparent',ring:on?'#07834D':'#5E5E5A'});
    const sections = [['Structure',[['Surface',1],['Plates',1],['Mantle',0]]],['Activity',[['Plate motion',1],['Earthquakes',1],['Magma',1],['Volcanoes',1]]],['Explain',[['Labels',1],['Motion arrows',0]]]].map(([title,rows])=>({title,rows:rows.map(([n,o])=>row(n,!!o))}));
